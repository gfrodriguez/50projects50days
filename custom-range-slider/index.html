<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Deslizante Personalizado</title>
    <meta name="description" content="Componente de deslizador personalizado para seleccionar un rango de valores." />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1>Control Deslizante Personalizado</h1>
    <div class="range-container">
        <input type="range" id="range" min="0" max="100">
        <label for="range">50</label>
    </div>
    <script src="script.js"></script>
</body>

</html>
