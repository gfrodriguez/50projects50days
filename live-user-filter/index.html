<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Usuarios en Tiempo Real</title>
    <meta name="description"
        content="Componente que busca y filtra usuarios mientras se escribe con resultados instantáneos.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h4 class="title">Filtro de Usuarios en Tiempo Real</h4>
            <small class="subtitle">Buscar por nombre y/o ubicación</small>
            <input type="text" id="filter" placeholder="Search">
        </header>

        <ul id="result" class="user-list">
            <li>
                <h3>Loading...</h3>
            </li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>

</html>
